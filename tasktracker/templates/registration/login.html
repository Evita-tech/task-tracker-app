{% extends 'tasks/base.html' %}
{% block title %}Log In{% endblock %}
{% block content %}
    <div class="mx-auto" style="max-width: 400px;">
        <h1 class="mb-4">Log In</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-uedcl">Log In</button>
        </form>
        <div class="text-center mt-3">
    <a href="{% url 'register' %}" class="btn btn-uedcl">Sign Up</a>
</div>
    </div>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>My Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Tasks</h1>
        <a href="{% url 'create_task' %}" class="btn btn-primary mb-3">+ New Task</a>

        <form method="get" class="row g-2 mb-4">
            <div class="col-md-4">
                <input type="text" class="form-control" name="search" placeholder="Search by title" value="{{ search_query }}">
            </div>

            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="todo" {% if status_filter == 'todo' %}selected{% endif %}>To Do</option>
                    <option value="in_progress" {% if status_filter == 'in_progress' %}selected{% endif %}>In Progress</option>
                    <option value="done" {% if status_filter == 'done' %}selected{% endif %}>Done</option>
                </select>
            </div>

            <div class="col-md-3">
                <select name="sort" class="form-select">
                    <option value="">Sort by...</option>
                    <option value="title" {% if sort_by == 'title' %}selected{% endif %}>Title</option>
                    <option value="status" {% if sort_by == 'status' %}selected{% endif %}>Status</option>
                    <option value="due_date" {% if sort_by == 'due_date' %}selected{% endif %}>Due Date</option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-secondary w-100">Apply</button>
            </div>
        </form>

        <ul class="list-group">
            {% for task in tasks %}
                <li class="list-group-item">
                    <strong>{{ task.title }}</strong> - {{ task.status }} (Project: {{ task.project.name }})
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>

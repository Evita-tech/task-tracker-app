<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Task Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <style>
        :root {
            --uedcl-red: #C8102E;
            --uedcl-black: #111111;
        }
        body {
            background-color: #f5f5f5;
        }
        .navbar-uedcl {
            background-color: var(--uedcl-black);
            border-bottom: 4px solid var(--uedcl-red);
        }
        .navbar-uedcl .navbar-brand {
            color: #ffffff;
            font-weight: 600;
        }
        .navbar-uedcl .nav-link {
            color: #dddddd !important;
        }
        .navbar-uedcl .nav-link:hover {
            color: #ffffff !important;
        }
        .btn-uedcl {
            background-color: var(--uedcl-red);
            color: #fff;
            border: none;
        }
        .btn-uedcl:hover {
            background-color: #a10d24;
            color: #fff;
        }
         input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            max-width: 500px;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            margin-top: 0.25rem;
            margin-bottom: 0.75rem;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--uedcl-red);
            box-shadow: 0 0 0 0.2rem rgba(200, 16, 46, 0.15);
        }
        form p {
            margin-bottom: 0.75rem;
        }
        form label {
            font-weight: 500;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-uedcl navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
                <img src="{% static 'tasks/uedcl-logo.png' %}" alt="UEDCL logo" height="40">
                Task Tracker
            </a>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link d-inline" href="{% url 'dashboard' %}">Dashboard</a>
                <a class="nav-link d-inline" href="{% url 'project_list' %}">Projects</a>
                <a class="nav-link d-inline" href="{% url 'task_list' %}">Tasks</a>
                <form method="post" action="{% url 'logout' %}" class="mb-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-uedcl btn-sm">Log Out</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
